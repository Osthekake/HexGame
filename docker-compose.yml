services:
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - hexgame-data:/data
    environment:
      - DB_PATH=/data/hexgame.db

volumes:
  hexgame-data:
