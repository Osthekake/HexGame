<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hex Game</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="7a64687d-ff22-4725-81b8-4293512139ac"></script>
</head>
<body>
  <div class="score-container">
    <span class="score-text">Score: <span class="score-points" id="points"></span></span>
  </div>
  <div class="horizontal-flex content">
    <div id="canvas-container">
      <canvas id="myCanvas" >
        Your browser does not support the canvas element.
      </canvas>
    </div>
    <div id="time" ></div>
  </div>


  <button class="button highscore-button" id="highscore-button">&#127942;</button>

  <div class="settings-container">
    <button class="button settings-button" id="settings-button">⚙</button>
    <div class="settings-menu" id="settings-menu">
      <h3 class="settings-title">Renderer</h3>
      <button class="button settings-option" id="renderer-canvas2d">Canvas 2D</button>
      <button class="button settings-option" id="renderer-threejs">Three.js</button>

      <h3 class="settings-title">Input</h3>
      <button class="button settings-option" id="input-keyboard">Keyboard</button>
      <button class="button settings-option" id="input-gamepad">Gamepad</button>
      <button class="button settings-option" id="input-touch">Touch</button>
    </div>
  </div>

  <div class="overlay-container">
    <h3 class="instruction-text">Use arrows to move. a, d to rotate. Rotate to begin timer.</h3>
    <h2 class="game-over-text" id="game-over-text">Game Over</h2>
    <button class="button" id="restart-button">Restart</button>
  </div>

  <div class="highscore-overlay" id="highscore-overlay" style="display: none;">
    <div class="highscore-panel">
      <button class="highscore-close-btn" id="close-highscore-btn">&times;</button>

      <!-- Upload Prompt View -->
      <div id="upload-prompt" style="display: none;">
        <h2 class="highscore-title">New Score!</h2>
        <p class="highscore-score-display">Score: <span id="upload-score-display"></span></p>
        <div class="highscore-form-group">
          <label for="nickname-input">Nickname</label>
          <input type="text" id="nickname-input" maxlength="20" placeholder="Enter nickname" autocomplete="off" />
        </div>
        <div class="highscore-form-actions">
          <button class="button" id="upload-score-btn">Upload Score</button>
          <button class="button highscore-secondary-btn" id="skip-upload-btn">Skip</button>
        </div>
        <p id="upload-status" class="highscore-status"></p>
      </div>

      <!-- Highscore Board View -->
      <div id="highscore-board" style="display: none;">
        <div class="highscore-tabs">
          <button class="highscore-tab active" id="tab-alltime">All Time</button>
          <button class="highscore-tab" id="tab-today">Today</button>
          <button class="highscore-tab" id="tab-region">My Region</button>
        </div>
        <div id="highscore-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
