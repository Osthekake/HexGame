server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    location /HexGame/ {
        try_files $uri $uri/ /HexGame/index.html;
    }
}
